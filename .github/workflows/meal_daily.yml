name: Daily school meal

on:
  schedule:
    # 06:25 KST, Monday to Friday (21:25 UTC, Sunday to Thursday)
    - cron: "25 21 * * 0-4"
    # 09:00 KST on Saturdays and Sundays (00:00 UTC)
    - cron: "0 0 * * 6,0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-meal-daily
  cancel-in-progress: false

jobs:
  send-meal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      OFFICE_CODE: ${{ secrets.OFFICE_CODE }}
      SCHOOL_CODE: ${{ secrets.SCHOOL_CODE }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKENS: ${{ secrets.KAKAO_REFRESH_TOKENS }}
      KAKAO_REFRESH_TOKEN_ME: ${{ secrets.KAKAO_REFRESH_TOKEN_ME }}
      KAKAO_REFRESH_TOKEN_WIFE: ${{ secrets.KAKAO_REFRESH_TOKEN_WIFE }}
      KAKAO_REFRESH_TOKEN_DAUGHTER: ${{ secrets.KAKAO_REFRESH_TOKEN_DAUGHTER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send weekend Psalm
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 6,0'
        run: python main.py --send-weekend-psalm
      - name: Check and send meal
        if: github.event_name != 'schedule' || github.event.schedule != '0 0 * * 6,0'
        run: python main.py
