name: Daily school meal

on:
  schedule:
    # 02:25 KST, Monday to Friday (17:25 UTC, Sunday to Thursday)
    - cron: "25 17 * * 0-4"
    # 03:00 KST on Saturdays and Sundays (18:00 UTC, Friday and Saturday)
    - cron: "0 18 * * 5,6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-meal-daily
  cancel-in-progress: false

jobs:
  send-meal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      OFFICE_CODE: ${{ secrets.OFFICE_CODE }}
      SCHOOL_CODE: ${{ secrets.SCHOOL_CODE }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKENS: ${{ secrets.KAKAO_REFRESH_TOKENS }}
      KAKAO_REFRESH_TOKEN_ME: ${{ secrets.KAKAO_REFRESH_TOKEN_ME }}
      KAKAO_REFRESH_TOKEN_WIFE: ${{ secrets.KAKAO_REFRESH_TOKEN_WIFE }}
      KAKAO_REFRESH_TOKEN_DAUGHTER: ${{ secrets.KAKAO_REFRESH_TOKEN_DAUGHTER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send weekend Psalm
        id: send-psalm
        if: github.event_name == 'schedule' && github.event.schedule == '0 18 * * 5,6'
        run: python main.py --send-weekend-psalm
      - name: Commit sent Psalm history
        if: always() && github.event_name == 'schedule' && github.event.schedule == '0 18 * * 5,6'
        run: |
          git add data/weekend_psalm_history.json
          if git diff --cached --quiet; then
            echo "No new sent Psalm entry to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record weekend Psalm delivery"
          git push origin HEAD:main
      - name: Check and send meal
        if: github.event_name != 'schedule' || github.event.schedule != '0 18 * * 5,6'
        run: python main.py

  build-pages:
    needs: send-meal
    if: always() && github.event_name == 'schedule' && github.event.schedule == '0 18 * * 5,6'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Build Psalm list page
        run: python build_psalm_page.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
