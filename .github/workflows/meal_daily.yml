name: Daily school meal

on:
  schedule:
    # Backup cron triggers (GitHub-hosted cron may have delays, Cloud Scheduler is primary)
    # 02:25 KST, Monday to Friday (17:25 UTC, Sunday to Thursday)
    - cron: "25 17 * * 0-4"
    # 03:00 KST on Saturdays and Sundays (18:00 UTC, Friday and Saturday)
    - cron: "0 18 * * 5,6"
  workflow_dispatch:
    inputs:
      force_mode:
        description: "강제 실행 모드 (기본: KST 요일 자동 판별)"
        required: false
        type: choice
        default: "auto"
        options:
          - "auto"
          - "meal"
          - "psalm"

permissions:
  contents: read

concurrency:
  group: school-meal-daily
  cancel-in-progress: false

jobs:
  send-meal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    outputs:
      is_weekend: ${{ steps.check-mode.outputs.is_weekend }}
    env:
      NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      OFFICE_CODE: ${{ secrets.OFFICE_CODE }}
      SCHOOL_CODE: ${{ secrets.SCHOOL_CODE }}
      COURIER_DISPATCH_TOKEN: ${{ secrets.COURIER_DISPATCH_TOKEN || secrets.GH_PAT }}
      COURIER_WORKER_URL: ${{ vars.COURIER_WORKER_URL }}
      COURIER_SYNC_TOKEN: ${{ secrets.COURIER_SYNC_TOKEN }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKENS: ${{ secrets.KAKAO_REFRESH_TOKENS }}
      KAKAO_REFRESH_TOKEN_ME: ${{ secrets.KAKAO_REFRESH_TOKEN_ME }}
      KAKAO_REFRESH_TOKEN_WIFE: ${{ secrets.KAKAO_REFRESH_TOKEN_WIFE }}
      KAKAO_REFRESH_TOKEN_DAUGHTER: ${{ secrets.KAKAO_REFRESH_TOKEN_DAUGHTER }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Determine run mode (Weekday Meal vs Weekend Psalm)
        id: check-mode
        run: |
          FORCE_MODE="${{ inputs.force_mode || 'auto' }}"
          KST_DOW=$(TZ=Asia/Seoul date +%u)
          echo "KST Day of Week: $KST_DOW (1=Mon ... 6=Sat, 7=Sun), Force Mode: $FORCE_MODE"

          if [ "$FORCE_MODE" = "psalm" ]; then
            echo "is_weekend=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE_MODE" = "meal" ]; then
            echo "is_weekend=false" >> "$GITHUB_OUTPUT"
          elif [ "$KST_DOW" -eq 6 ] || [ "$KST_DOW" -eq 7 ]; then
            echo "is_weekend=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_weekend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send weekend Psalm
        id: send-psalm
        if: steps.check-mode.outputs.is_weekend == 'true'
        run: python main.py --send-weekend-psalm

      - name: Commit sent Psalm history
        if: always() && steps.check-mode.outputs.is_weekend == 'true'
        run: |
          git add data/weekend_psalm_history.json
          if git diff --cached --quiet; then
            echo "No new sent Psalm entry to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record weekend Psalm delivery"
          git push origin HEAD:main

      - name: Check and send meal
        if: steps.check-mode.outputs.is_weekend == 'false'
        run: python main.py

  build-pages:
    needs: send-meal
    if: always() && needs.send-meal.result == 'success' && needs.send-meal.outputs.is_weekend == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Build Psalm list page
        run: python build_psalm_page.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
