name: Daily school meal

on:
  schedule:
    # 07:30 KST, Monday to Friday (22:30 UTC, Sunday to Thursday)
    - cron: "30 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-meal-daily
  cancel-in-progress: false

jobs:
  send-meal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      OFFICE_CODE: ${{ secrets.OFFICE_CODE }}
      SCHOOL_CODE: ${{ secrets.SCHOOL_CODE }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKENS: ${{ secrets.KAKAO_REFRESH_TOKENS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send today's meal
        run: python main.py
